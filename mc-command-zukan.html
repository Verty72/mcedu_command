<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>マイクラ教育版 コマンド図鑑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7EFF3; --surface:#FFFFFF; --surface-2:#F3F7F9; --ink:#1D2830; --muted:#55666F; --line:#C7D5DC;
  --cmd:#D96A08; --req:#23874A; --opt:#7149CF;
  --chat:#1A2026; --chat-ink:#F1F1F1;
  --c-cmd:#FFAE5C; --c-req:#7FE0A0; --c-opt:#C7AEFF; --c-sel:#FFE27A; --c-num:#8FD3FF; --c-str:#FFB3C8;
  --pass:#3F9B4F; --neutral:#C9961A; --hostile:#C8413A; --boss:#7149CF; --thing:#2F7DBF;
  --pass-bg:#DDF1DF; --neutral-bg:#F7ECCB; --hostile-bg:#F7DCDA; --boss-bg:#E7DEFA; --thing-bg:#D9E9F7;
  --tip:#FFF6D6; --tip-line:#E8CF73; --warn:#FDE3E0; --warn-line:#E5938B;
  --focus:#2F7DBF;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --pixel:"DotGothic16","Osaka-Mono","MS Gothic",ui-monospace,monospace;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11171B; --surface:#1A2228; --surface-2:#212B32; --ink:#E6EDF1; --muted:#9AAEB8; --line:#2E3C45;
    --cmd:#FF9A3D; --req:#4FC277; --opt:#A88BF2;
    --chat:#090C0F;
    --pass-bg:#1E3324; --neutral-bg:#3A3018; --hostile-bg:#3D2120; --boss-bg:#2C2445; --thing-bg:#1B2E40;
    --tip:#3A3418; --tip-line:#7A6A2A; --warn:#3D2120; --warn-line:#8A4A44;
    --focus:#8FC6FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11171B; --surface:#1A2228; --surface-2:#212B32; --ink:#E6EDF1; --muted:#9AAEB8; --line:#2E3C45;
  --cmd:#FF9A3D; --req:#4FC277; --opt:#A88BF2;
  --chat:#090C0F;
  --pass-bg:#1E3324; --neutral-bg:#3A3018; --hostile-bg:#3D2120; --boss-bg:#2C2445; --thing-bg:#1B2E40;
  --tip:#3A3418; --tip-line:#7A6A2A; --warn:#3D2120; --warn-line:#8A4A44;
  --focus:#8FC6FF;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 140px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* header */
.top{padding:22px 20px 10px;max-width:1180px;margin:0 auto;display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--pixel);font-weight:400;font-size:clamp(26px,4.4vw,40px);line-height:1.15;letter-spacing:.02em}
.brand p{margin:6px 0 0;color:var(--muted);font-size:14px}
.theme-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:2px solid var(--line)}
.tabs-in{max-width:1180px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:8px 14px 0;scrollbar-width:thin}
.tab{flex:0 0 auto;border:0;background:none;padding:8px 12px 10px;border-radius:10px 10px 0 0;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;border-bottom:4px solid transparent;margin-bottom:-2px}
.tab .tn{font-family:var(--pixel);font-size:16px}
.tab .tj{font-size:11.5px;color:var(--muted)}
.tab:hover{background:var(--surface-2)}
.tab[aria-selected="true"]{border-bottom-color:var(--cmd);background:var(--surface-2)}
.tab[aria-selected="true"] .tn{color:var(--cmd)}

main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
.sec-head{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin:4px 0 6px}
.sec-head h2{margin:0;font-family:var(--pixel);font-weight:400;font-size:clamp(32px,6vw,52px);line-height:1;color:var(--cmd)}
.sec-head .jp{font-size:clamp(18px,2.6vw,24px);font-weight:800}
.lead{margin:0 0 18px;max-width:46em;color:var(--muted)}
h3{font-size:19px;font-weight:800;margin:34px 0 10px;display:flex;align-items:center;gap:10px}
h3 .count{font-size:13px;font-weight:500;color:var(--muted)}

/* chat bar */
.chat{background:var(--chat);color:var(--chat-ink);font-family:var(--pixel);font-size:clamp(16px,2.1vw,20px);line-height:1.5;padding:10px 14px;border-radius:4px;overflow-x:auto;white-space:pre;flex:1;min-width:0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.06)}
.chat .t-cmd{color:var(--c-cmd)} .chat .t-sel{color:var(--c-sel)} .chat .t-num{color:var(--c-num)} .chat .t-id{color:var(--c-req)} .chat .t-str{color:var(--c-str)}
.chat .s-cmd{color:var(--c-cmd)} .chat .s-req{color:var(--c-req)} .chat .s-opt{color:var(--c-opt)} .chat .s-lit{color:var(--chat-ink)}
.chat-row{display:flex;gap:8px;align-items:stretch}
.copy{flex:0 0 auto;border:0;border-radius:4px;background:var(--cmd);color:#fff;font-weight:700;padding:0 14px;cursor:pointer;font-size:14px;min-height:44px}
.copy:hover{filter:brightness(1.08)}
.copy.done{background:var(--req)}

/* maker */
.maker{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--nav-h,64px));z-index:10;background:var(--surface);border:2px solid var(--cmd);border-radius:12px;padding:12px 14px 14px;margin:6px 0 8px;box-shadow:0 6px 18px -12px rgba(0,0,0,.45)}
.maker.flash{animation:flash .5s ease}
@keyframes flash{0%{border-color:var(--req);transform:scale(1.01)}100%{border-color:var(--cmd);transform:none}}
.maker-top{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-bottom:8px}
.maker-title{font-weight:800;font-size:15px}
.maker-pick{font-size:14px;color:var(--muted)}
.maker-pick b{color:var(--ink)}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13.5px;cursor:pointer;line-height:1.6}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip:hover{border-color:var(--muted)}

/* syntax */
.syntax{display:grid;gap:8px;margin-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin:8px 0 4px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:currentColor}
.legend .l-cmd{color:var(--cmd)} .legend .l-req{color:var(--req)} .legend .l-opt{color:var(--opt)}
.legend span b{color:var(--muted);font-weight:500}
.parts{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:0;margin:12px 0 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.parts dt,.parts dd{margin:0;padding:10px 14px;border-top:1px solid var(--line)}
.parts dt:first-of-type,.parts dt:first-of-type + dd{border-top:0}
.parts dt{font-family:var(--pixel);font-size:16px;background:var(--surface-2);white-space:nowrap}
.parts dt.k-req{color:var(--req)} .parts dt.k-opt{color:var(--opt)} .parts dt.k-cmd{color:var(--cmd)}
.parts dd small{display:block;color:var(--muted);font-size:13.5px}
@media (max-width:560px){.parts{grid-template-columns:1fr}.parts dd{border-top:0;padding-top:0}.parts dt{background:none;padding-bottom:2px}}

/* examples */
.examples{display:grid;gap:12px}
.ex .what{margin:4px 2px 0;font-size:14.5px}
.ex .what::before{content:"↳ ";color:var(--muted)}

.notes{display:grid;gap:10px;margin-top:18px}
.note{border-left:5px solid var(--tip-line);background:var(--tip);padding:10px 14px;border-radius:0 8px 8px 0;font-size:14.5px}
.note.warn{border-left-color:var(--warn-line);background:var(--warn)}
.note b{font-weight:800}

/* tables (basics/execute) */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:9px 12px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
thead th{border-top:0;background:var(--surface-2);font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
td code,.inline-code{font-family:var(--pixel);font-size:15px;background:var(--surface-2);padding:1px 6px;border-radius:4px;white-space:nowrap}
td:first-child code{color:var(--cmd)}

.steps{counter-reset:s;display:grid;gap:10px;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);font-family:var(--pixel);font-size:18px;width:34px;height:34px;display:grid;place-items:center;background:var(--req);color:#fff;border-radius:6px}

/* id finder */
.finder{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin:4px 0 14px}
.search{flex:1 1 220px;min-width:0;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:16px}
.search:focus{border-color:var(--focus);outline:none}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;background:var(--surface);border:2px solid var(--line);border-radius:10px;overflow:hidden;position:relative}
.card:hover{border-color:var(--muted)}
.card:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.card[aria-pressed="true"]{border-color:var(--cmd);box-shadow:0 0 0 2px var(--cmd)}
.vis{height:104px;display:grid;place-items:center;position:relative;font-size:46px;line-height:1}
.vis canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.vis.mob[data-c="pass"]{background:var(--pass-bg)} .vis.mob[data-c="neutral"]{background:var(--neutral-bg)} .vis.mob[data-c="hostile"]{background:var(--hostile-bg)} .vis.mob[data-c="boss"]{background:var(--boss-bg)} .vis.mob[data-c="thing"]{background:var(--thing-bg)}
.vis.ptc{background:linear-gradient(#1f2a35,#2c3a46 78%,#4a8f3c 78%,#4a8f3c 84%,#7a5434 84%)}
.vis.eff .orb{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:32px;box-shadow:inset -6px -8px 0 rgba(0,0,0,.18),inset 6px 6px 0 rgba(255,255,255,.25)}
.vis.eff{background:var(--surface-2)}
.vis.ench{background:var(--surface-2);font-size:30px;gap:2px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;padding:8px}
.vis.snd{background:var(--surface-2)}
.vis.mus{background:var(--surface-2)}
.disc{width:78px;height:78px;border-radius:50%;background:repeating-radial-gradient(circle,#1c1c1c 0 2px,#2a2a2a 2px 4px);display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.disc i{width:28px;height:28px;border-radius:50%;display:block;box-shadow:inset 0 0 0 9px var(--lab),inset 0 0 0 14px #111}
.card:hover .disc,.card[aria-pressed="true"] .disc{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.body{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px;flex:1}
.nm{font-weight:800;font-size:15.5px;line-height:1.35}
.id{font-family:var(--pixel);font-size:13.5px;color:var(--req);word-break:break-all;line-height:1.35}
.ds{font-size:12.5px;color:var(--muted);line-height:1.5}
.badges{position:absolute;top:6px;left:6px;right:6px;display:flex;justify-content:space-between;pointer-events:none}
.bd{font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px;background:var(--surface);color:var(--ink);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.bd.star{color:#B07A00}
.bd.warn{background:var(--hostile);color:#fff}
.bd.edu{background:var(--thing);color:#fff}
.bd.new{background:var(--opt);color:#fff}
.bd.lv{background:var(--ink);color:var(--surface)}
.empty{padding:30px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:12px}
.grp-title{grid-column:1/-1;font-weight:800;font-size:14px;color:var(--muted);margin:10px 0 -4px;display:flex;gap:8px;align-items:center}
.grp-title::after{content:"";flex:1;height:1px;background:var(--line)}

.give{display:flex;flex-wrap:wrap;gap:8px}
.give button{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;cursor:pointer;font-family:var(--pixel);font-size:14px}
.give button:hover{border-color:var(--cmd)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;transition:.2s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

footer{max-width:1180px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:13px}



.groups-in{max-width:1180px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:10px 14px 2px;scrollbar-width:thin}
.gchip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 13px;font-size:13.5px;font-weight:700;cursor:pointer;line-height:1.6;color:var(--muted)}
.gchip:hover{border-color:var(--muted)}
.gchip[aria-pressed="true"]{background:var(--cmd);border-color:var(--cmd);color:#fff}
.vis.fmt{background:#2B2F33;padding-top:16px}
.fmtx{font-family:var(--pixel);font-size:26px;text-shadow:3px 3px 0 rgba(0,0,0,.45)}
.tab-sep{flex:0 0 1px;align-self:center;height:28px;background:var(--line);margin:0 6px}
.vis.simple{background:var(--surface-2)}
.vis.sky{font-size:44px;overflow:hidden}
.vis.sky .overlay{position:absolute;inset:0;width:100%;height:100%}
.vis.sky .skyemo{position:relative}
.vis.compass{background:var(--surface-2)}
.dial{width:78px;height:78px;border-radius:50%;border:3px solid var(--line);background:var(--surface);position:relative;font-size:11px;font-weight:800;color:var(--muted)}
.dial span{position:absolute;line-height:1}
.dial .n{top:3px;left:50%;transform:translateX(-50%);color:var(--hostile)} .dial .s{bottom:3px;left:50%;transform:translateX(-50%)}
.dial .e{right:4px;top:50%;transform:translateY(-50%)} .dial .w{left:4px;top:50%;transform:translateY(-50%)}
.dial .arrow{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:22px;color:var(--cmd);transform-origin:50% 50%}
.dial .arrow::after{content:"";}
.vis.blkv{background:var(--surface-2)}
canvas.blk{width:60px!important;height:60px!important;image-rendering:pixelated;box-shadow:0 3px 0 rgba(0,0,0,.25)}
canvas.blk.air{outline:2px dashed var(--muted);outline-offset:-2px;box-shadow:none}
.lvl{margin-top:4px;padding-top:5px;border-top:1px dashed var(--line);font-size:12.5px;line-height:1.5;color:var(--ink)}
.lvl b{font-family:var(--pixel);font-weight:400;color:var(--opt);margin-right:2px}
.lvl.none{color:var(--muted)}
.lv-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:10px}
.lv-label{font-size:14px;font-weight:800}
.step{width:40px;height:36px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-size:20px;font-weight:800;cursor:pointer;line-height:1}
.step:disabled{opacity:.35;cursor:default}
.lv-val{font-family:var(--pixel);font-size:17px;min-width:4.5em;text-align:center}
.lv-txt{font-size:14.5px;font-weight:700;color:var(--opt)}
details.lvtable summary{cursor:pointer;font-weight:700;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.lvtable[open] summary{margin-bottom:10px}
details.lvtable td{font-size:13px;min-width:110px}
td.muted{color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.mode{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.mode.before{background:var(--surface-2)}
.mode figcaption{font-size:13px;color:var(--muted);line-height:1.5}
.mode figcaption b{display:block;color:var(--ink);font-family:var(--pixel);font-weight:400;font-size:15px}
.mgrid{display:grid;grid-template-columns:repeat(5,18px);gap:2px}
.mc{width:18px;height:18px;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;color:#5E3D14}
.m-G,.m-D{background:#F5D33C;box-shadow:inset -2px -2px 0 rgba(0,0,0,.15)}
.m-S{background:#8A8A8A;box-shadow:inset -2px -2px 0 rgba(0,0,0,.2)}
.m-air{outline:1.5px dashed var(--line);outline-offset:-2px}
@media (max-width:700px),(max-height:560px){.maker{position:static}}
@media (prefers-reduced-motion:reduce){.maker.flash{animation:none}.card:hover .disc,.card[aria-pressed="true"] .disc{animation:none}.toast{transition:none}}
@media print{nav.tabs,.maker,.finder,.theme-btn,.copy{display:none!important}body{background:#fff}.card{break-inside:avoid}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>マイクラ教育版 コマンド図鑑</h1>
    <p>図鑑のカードをタップすると、そのIDでコマンドができるよ。コピーしてマイクラにはりつけよう。</p>
  </div>
  <button class="theme-btn" id="themeBtn" type="button">画面の明るさ：自動</button>
</header>
<nav class="tabs" aria-label="コマンドをえらぶ"><div class="groups-in" id="groups" role="group" aria-label="なかま"></div><div class="tabs-in" id="tabs" role="tablist"></div></nav>
<main id="main"></main>
<footer>マイクラ教育版（統合版ベース）向け。バージョンによって使えないIDや、見え方・音がちがうことがあります。カードの絵や、レベルごとの数字は「だいたい」の目安です。</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ====================== データ ====================== */
const MOBS = [
 // id, 名前, 絵, 分類, せつめい, ★, 注意/タグ

 ["rabbit","ウサギ","🐇","pass","ぴょんぴょんはねる",1],
 ["horse","ウマ","🐎","pass","くらをつけて乗れる",1],
 ["donkey","ロバ","🐴","pass","チェストをつけられる"],
 ["mule","ラバ","🐴","pass","ウマとロバの子ども"],
 ["llama","ラマ","🦙","pass","おこるとつばをとばす"],
 ["camel","ラクダ","🐫","pass","2人で乗れる"],
 ["cat","ネコ","🐈","pass","クリーパーがこわがる",1],
 ["ocelot","ヤマネコ","🐆","pass","すばしっこい"],
 ["fox","キツネ","🦊","pass","アイテムをくわえる",1],
 ["parrot","オウム","🦜","pass","かたに乗る",1],
 ["panda","パンダ","🐼","pass","竹が大好き",1],
 ["turtle","カメ","🐢","pass","砂浜にたまごをうむ"],
 ["axolotl","ウーパールーパー","🦎","pass","水の中の仲間",1],
 ["frog","カエル","🐸","pass","すむ場所で色がかわる"],
 ["armadillo","アルマジロ","🦔","pass","こわいとまるくなる",0,"new"],
 ["sniffer","スニッファー","🦕","pass","古い種をほりだす"],
 ["mooshroom","ムーシュルーム","🍄","pass","キノコシチューがとれる"],

const $ = (s,r=document)=>r.querySelector(s);
function h(tag,attrs={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(v==null||v===false)continue;if(k==="class")e.className=v;else if(k==="html")e.innerHTML=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?"":v)}for(const k of kids.flat()){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(k))}return e}
const toKata = s => (s||"").toLowerCase().replace(/[\u3041-\u3096]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60));
const toast = (msg)=>{const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1600)};
async function copyText(text,btn){
  let ok=false;
  try{await navigator.clipboard.writeText(text);ok=true}catch(e){
    try{const ta=h("textarea",{style:"position:fixed;opacity:0"});ta.value=text;document.body.append(ta);ta.select();ok=document.execCommand("copy");ta.remove()}catch(e2){}
  }
  toast(ok?"コピーしました":"コピーできませんでした。長おしでえらんでコピーしてね");
  if(ok&&btn){btn.classList.add("done");const o=btn.textContent;btn.textContent="できた！";setTimeout(()=>{btn.classList.remove("done");btn.textContent=o},1200)}
}
function hl(cmd){
  const out=document.createDocumentFragment();
  const re=/("[^"]*"|\S+|\s+)/g;let m,first=true;
  while((m=re.exec(cmd))){const t=m[1];let cls=null;
    if(/^\s+$/.test(t)){out.append(t);continue}
    if(first&&t.startsWith("/")){cls="t-cmd"}
    else if(t.startsWith("@")){cls="t-sel"}
    else if(t.startsWith("\"")){cls="t-str"}
    else if(/^[~^]?-?[\d.]*$/.test(t)&&t!==""&&/[\d~^]/.test(t)){cls="t-num"}
    else if(/^minecraft:/.test(t)){cls="t-id"}
    first=false;out.append(cls?h("span",{class:cls},t):t)}
  return out;
}
function chatRow(cmd){
  const chat=h("div",{class:"chat"});chat.append(hl(cmd));
  return h("div",{class:"chat-row"},chat,h("button",{class:"copy",type:"button",onclick:e=>copyText(cmd,e.currentTarget),"aria-label":"コピー: "+cmd},"コピー"));
}

const SPR={

const PW=160,PH=110,GROUND=PH*0.78;
function rnd(a,b){return a+Math.random()*(b-a)}
function makeSys(cv,p){
  const dpr=Math.min(2,window.devicePixelRatio||1);cv.width=PW*dpr;cv.height=PH*dpr;
  const ctx=cv.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);
  const sys={cv,ctx,p,ps:[],t:0};
  const z=p.z||3;
  sys.spawn=()=>{
    const m=p.m;const pt={age:0,a:1,z,shape:p.s,col:p.c[0],col2:p.c[1]||p.c[0]};
    if(p.multi){pt.col=p.c[Math.floor(Math.random()*p.c.length)];pt.col2=pt.col}
    if(p.s==="rune"){pt.shape="rune"+(1+Math.floor(Math.random()*4))}
    if(m==="rise"){pt.x=rnd(PW*.3,PW*.7);pt.y=GROUND-6;pt.vx=rnd(-.15,.15);pt.vy=rnd(-.7,-.35);pt.life=rnd(90,140);pt.sw=rnd(0,6)}
    else if(m==="float"){pt.x=rnd(PW*.2,PW*.8);pt.y=rnd(PH*.15,GROUND-10);pt.vx=rnd(-.25,.25);pt.vy=rnd(-.25,.15);pt.life=rnd(70,120)}
    else if(m==="fall"){pt.x=rnd(10,PW-10);pt.y=-6;pt.vx=rnd(-.2,.2);pt.vy=rnd(.35,.6);pt.life=200;pt.sw=rnd(0,6)}
    else if(m==="pop"){const an=rnd(0,Math.PI*2),sp=rnd(.6,1.8);pt.x=PW/2;pt.y=PH*.45;pt.vx=Math.cos(an)*sp;pt.vy=Math.sin(an)*sp;pt.life=rnd(35,60);pt.drag=.95}
    else if(m==="spray"){pt.x=PW/2+rnd(-6,6);pt.y=GROUND-4;pt.vx=rnd(-1.3,1.3);pt.vy=rnd(-3,-1.8);pt.life=90;pt.g=.07}
    else if(m==="swirl"){const an=rnd(0,Math.PI*2),r=rnd(40,55);pt.cx=PW/2;pt.cy=PH*.45;pt.an=an;pt.r=r;pt.life=rnd(70,100);pt.x=pt.cx+Math.cos(an)*r;pt.y=pt.cy+Math.sin(an)*r*.6}
    else if(m==="drip"){pt.x=[PW*.3,PW*.5,PW*.7][Math.floor(Math.random()*3)];pt.y=6;pt.vx=0;pt.vy=0;pt.g=.06;pt.life=120;pt.wait=rnd(10,40)}
    else if(m==="still"){pt.x=PW/2;pt.y=GROUND-14;pt.vx=0;pt.vy=-.15;pt.life=40;pt.z=z}
    else if(m==="rain"){pt.x=rnd(0,PW+20);pt.y=-6;pt.vx=-.6;pt.vy=rnd(3.2,4.2);pt.life=40;pt.z=2}
    else if(m==="smoke"){pt.x=PW/2+rnd(-12,12);pt.y=GROUND-4;pt.vx=rnd(-.15,.15);pt.vy=p.tall?rnd(-.7,-.5):rnd(-.45,-.25);pt.life=p.tall?160:110;pt.rad=rnd(5,8);pt.grow=.06}
    sys.ps.push(pt);
  };
  sys.blast=()=>{for(let i=0;i<(p.n||7);i++){const an=rnd(0,Math.PI*2),d=rnd(0,p.n>10?30:16);sys.ps.push({x:PW/2+Math.cos(an)*d,y:PH*.45+Math.sin(an)*d*.7,vx:Math.cos(an)*rnd(.1,.5),vy:Math.sin(an)*rnd(.1,.4)-.1,life:rnd(40,60),age:-Math.floor(rnd(0,p.n>10?25:8)),rad:rnd(5,9),grow:rnd(.15,.3),shape:"puff",col:Math.random()<.5?p.c[0]:p.c[1]})}};
  sys.step=()=>{
    sys.t++;const m=p.m;
    if(m==="blast"){if(sys.t%70===1)sys.blast()}
    else if(m==="rings"){if(sys.t%45===1)sys.ps.push({x:PW/2,y:PH*.45,r:4,life:40,age:0,shape:"ringc",col:p.c[0]})}
    else{const rate={rise:.12,float:.15,fall:.12,pop:0,spray:0,swirl:.3,drip:.03,still:.15,smoke:.12,rain:.95}[m];
      if(m==="pop"||m==="spray"){if(sys.t%60===1){const n=p.few?3:(m==="spray"?14:12);for(let i=0;i<n;i++)sys.spawn()}}
      else if(Math.random()<rate&&sys.ps.length<(m==="rain"?60:40)){sys.spawn();if(m==="rain"&&Math.random()<.5)sys.spawn()}}
    for(const q of sys.ps){q.age++;if(q.age<0)continue;
      if(q.wait&&q.age<q.wait)continue;
      if(m==="swirl"&&q.r!=null){const k=1-q.age/q.life;q.an+=.05;q.x=q.cx+Math.cos(q.an)*q.r*k;q.y=q.cy+Math.sin(q.an)*q.r*k*.6}
      else if(q.shape==="ringc"){q.r+=1.6}
      else{if(q.g)q.vy+=q.g;if(q.drag){q.vx*=q.drag;q.vy*=q.drag}

function blockCanvas(id,t){

    case"liquid":for(let j=0;j<N;j++)for(let i=0;i<N;i++)px(i,j,((i+j*2)%5===0)?c2:shade(c,Math.round((R()-.5)*10)));break;
    case"ice":noise(c,10);for(let k=0;k<5;k++){px(k+1,6-k,c2)}px(5,1,c2);px(6,2,c2);break;
    case"slime":x.fillStyle=c;x.fillRect(0,0,N,N);x.fillStyle=c2;x.fillRect(2,2,4,4);break;
    case"tnt":noise(c,16);for(let i=0;i<N;i++){px(i,3,c2);px(i,4,c2)}px(2,3,"#333");px(4,4,"#333");px(5,3,"#333");break;
    case"chest":noise(c,14);for(let i=0;i<N;i++){px(i,0,c2);px(i,N-1,c2);px(0,i,c2);px(N-1,i,c2);px(i,3,c2)}px(3,3,"#BFBFBF");px(4,3,"#BFBFBF");px(3,4,"#8A8A8A");px(4,4,"#8A8A8A");break;
    case"table":noise(c,14);for(let i=0;i<N;i++){px(i,0,c2);px(i,N-1,c2)}px(2,2,"#8A8A8A");px(5,2,"#8A8A8A");px(2,5,"#B8945F");px(5,5,"#6B5235");break;

    case"torch":px(3,3,c);px(4,3,c);for(let j=4;j<8;j++){px(3,j,c);px(4,j,shade(c,-20))}px(3,1,c2);px(4,1,c2);px(3,2,"#FF8A1A");px(4,2,"#FFE27A");break;
    case"box":noise(c,14);x.fillStyle=c2;x.fillRect(2,2,4,4);break;
    case"cmd":noise(c,14);x.fillStyle=c2;x.fillRect(2,2,4,4);px(3,3,"#E6E6E6");px(4,4,"#E6E6E6");break;
    case"barrier":x.strokeStyle=c;x.lineWidth=1;for(let a=0;a<32;a++){const an=a/32*Math.PI*2;px(Math.round(3.5+Math.cos(an)*3.2),Math.round(3.5+Math.sin(an)*3.2),c)}for(let k=1;k<7;k++)px(k,7-k,c);break;

    case"border":for(let j=0;j<N;j++)for(let i=0;i<N;i++)px(i,j,((i+j)%4<2)?c:c2);break;
  }

}

    const starBtn=mk("★ おすすめだけ",()=>{fStar=!fStar;draw()});if(hasStar)filters.append(starBtn);
    search.addEventListener("input",()=>{q=toKata(search.value.trim());draw()});
    function draw(){
      allBtn.setAttribute("aria-pressed",fGroup?"false":"true");gBtns.forEach(b=>b.setAttribute("aria-pressed",b._g===fGroup?"true":"false"));starBtn.setAttribute("aria-pressed",fStar?"true":"false");
      grid.replaceChildren();let n=0,last=null;
      for(const k of cards){const d=k._data;if(fGroup&&d.group!==fGroup)continue;if(fStar&&!d.star)continue;if(q&&!d.search.includes(q))continue;
        if(!fGroup&&!q&&groups.length>1&&d.group!==last){grid.append(h("div",{class:"grp-title"},d.group));last=d.group}
        grid.append(k);n++}
      if(!n)grid.append(h("div",{class:"empty",style:"grid-column:1/-1"},"見つかりません。ひらがな・カタカナ・英語でためしてみよう。"));
      count.textContent=n+"こ";
    }
    const select=(k,flash)=>{if(!st)return;cards.forEach(x=>x.setAttribute("aria-pressed","false"));k.setAttribute("aria-pressed","true");
      st.item=k._data;if(c.level==="ench")st.lv=k._data.max||1;st.update();
      if(flash&&maker){maker.classList.remove("flash");void maker.offsetWidth;maker.classList.add("flash");
        if(getComputedStyle(maker).position==="static"){const r=maker.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)maker.scrollIntoView({behavior:RM.matches?"auto":"smooth",block:"center"})}}};
    cards.forEach(k=>k.addEventListener("click",()=>select(k,true)));
    sec.append(h("h3",{},c.list.title,count),h("div",{class:"finder"},search,filters),grid);
    draw();
    if(c.level)sec.append(h("h3",{},"レベル早見表"),levelTable(c));
    select(cards.find(k=>k._data.star)||cards[0],false);
  }
  return sec;
}

  sec.append(h("h3",{},"うまくいかないとき"),h("div",{class:"notes"},...B.trouble.map(t=>h("div",{class:"note warn",html:t}))));

  return sec;

/* ====================== タブ ====================== */
const tabsEl=$("#tabs"),groupsEl=$("#groups"),main=$("#main");const built={};
const GROUPS=[...new Set(ORDER.map(k=>GROUP[k]))];
GROUPS.forEach(g=>groupsEl.append(h("button",{class:"gchip",type:"button","aria-pressed":"false","data-g":g,onclick:()=>show(CMDS.find(c=>GROUP[c.key]===g).key,true)},g)));
function show(key,push){
  const c=CMDS.find(x=>x.key===key)||CMDS[0];const g=GROUP[c.key];
  for(const b of groupsEl.children)b.setAttribute("aria-pressed",b.dataset.g===g?"true":"false");
  tabsEl.replaceChildren(...CMDS.filter(x=>GROUP[x.key]===g).map(x=>h("button",{class:"tab",role:"tab",type:"button",id:"tab-"+x.key,"aria-selected":x.key===c.key?"true":"false","aria-controls":"sec-"+x.key,onclick:()=>show(x.key,true)},h("span",{class:"tn"},x.name),h("span",{class:"tj"},x.jp))));
  if(!built[c.key])built[c.key]=c.key==="basics"?renderBasics(c):renderCmd(c);
  main.replaceChildren(built[c.key]);
  if(push){try{history.replaceState(null,"","#"+c.key)}catch(e){}window.scrollTo({top:0})}
  const ch=groupsEl.querySelector('[aria-pressed="true"]');const x=ch.getBoundingClientRect().left-groupsEl.getBoundingClientRect().left+groupsEl.scrollLeft;groupsEl.scrollLeft=Math.max(0,x-groupsEl.clientWidth/2+ch.offsetWidth/2);
}
window.addEventListener("hashchange",()=>show(location.hash.slice(1)));
show((location.hash||"").slice(1)||"basics");

const nav=$("nav.tabs");const setNav=()=>document.documentElement.style.setProperty("--nav-h",nav.offsetHeight+"px");

const tb=$("#themeBtn");const modes=["auto","light","dark"],lab={auto:"自動",light:"明るい",dark:"暗い"};let mode="auto";

const applyTheme=()=>{if(mode==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",mode);tb.textContent="画面の明るさ："+lab[mode]};
tb.addEventListener("click",()=>{mode=modes[(modes.indexOf(mode)+1)%3];try{localStorage.setItem("zukan-theme",mode)}catch(e){}applyTheme()});
applyTheme();
